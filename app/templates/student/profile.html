{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="page-header"><h1>My Profile</h1></div>

<div class="card" style="max-width:640px;">
  <div class="form-group"><label>Full Name</label><input type="text" value="{{ current_user.full_name }}" readonly></div>
  <div class="form-group"><label>Registration Number</label><input type="text" value="{{ student.reg_no }}" readonly></div>
  <div class="form-group"><label>Class</label><input type="text" value="{{ student.class_group.name if student.class_group else '—' }}" readonly></div>
  <div class="form-group"><label>Username</label><input type="text" value="{{ current_user.username }}" readonly></div>
</div>

<form method="POST" class="card form-card">
  <h3 style="margin-top:0;">Editable Details</h3>
  <div class="form-group"><label>Phone</label><input type="text" name="phone" value="{{ student.phone or '' }}"></div>
  <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ student.address or '' }}"></div>
  <div class="form-group"><label>New Password</label><input type="password" name="password" placeholder="Leave blank to keep current password"></div>
  <div class="form-actions"><button type="submit" class="btn btn-primary">Save Changes</button></div>
</form>
{% endblock %}
